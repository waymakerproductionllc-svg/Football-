:root {
  --ink: #07061a;
  --purple: #241773;
  --purple-hi: #4a35c9;
  --gold: #ffc72c;
  --tele: #ffe600;
  --red: #ff3b5c;
  --gray: #b9b7cc;
  --text: #f4f2ff;
  --dim: #9c98c4;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  color: var(--text);
}

#viewport {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
}

#stage {
  position: relative;
  width: 1920px; height: 1080px;
  flex: none;
  overflow: hidden;
  transform-origin: center center;
  background: var(--ink);
}

#bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(1200px 700px at 30% 55%, rgba(74, 53, 201, 0.35), transparent 70%),
    radial-gradient(900px 600px at 85% 30%, rgba(255, 199, 44, 0.10), transparent 70%),
    linear-gradient(160deg, #120c3a 0%, #07061a 55%, #0d0828 100%);
}
#bg::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px);
  pointer-events: none;
}

/* ---------- header ---------- */
#header {
  position: absolute; left: 40px; right: 40px; top: 22px; height: 118px;
  display: flex; align-items: center; justify-content: space-between;
}
.name-block { display: flex; align-items: center; gap: 22px; transform: skewX(-9deg); }
.num-badge {
  width: 104px; height: 104px;
  background: linear-gradient(180deg, var(--gold), #d99a00);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 4px var(--ink), 0 0 0 7px var(--gold), 0 10px 30px rgba(0,0,0,0.5);
}
.num-badge span { font-size: 80px; font-weight: 700; color: var(--ink); line-height: 1; }
.name-text { line-height: 0.86; }
.name-text .first { font-size: 40px; font-weight: 500; letter-spacing: 6px; color: var(--gold); }
.name-text .last {
  font-size: 82px; font-weight: 700; letter-spacing: 3px;
  text-shadow: 4px 4px 0 var(--purple), 0 0 30px rgba(74, 53, 201, 0.8);
}
.title-block { text-align: right; transform: skewX(-9deg); }
.title-main {
  display: inline-block;
  font-size: 52px; font-weight: 700; letter-spacing: 2px;
  padding: 2px 26px 6px;
  background: linear-gradient(90deg, var(--purple), var(--purple-hi));
  border-right: 10px solid var(--gold);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.title-sub { margin-top: 8px; font-size: 22px; letter-spacing: 7px; color: var(--dim); font-weight: 500; }

/* ---------- field ---------- */
#field { position: absolute; left: 0; top: 0; overflow: visible; }
#field text { font-family: 'Oswald', 'Arial Narrow', Impact, sans-serif; }

/* ---------- panel ---------- */
#panel {
  position: absolute; left: 1290px; top: 162px; width: 590px; height: 800px;
  background: linear-gradient(180deg, rgba(20, 14, 60, 0.92), rgba(8, 6, 26, 0.94));
  border: 2px solid rgba(255, 199, 44, 0.35);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 80px rgba(74, 53, 201, 0.15);
  clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 34px 100%, 0 calc(100% - 34px));
  padding: 26px 30px;
  overflow: hidden;
}
.p-week { display: flex; align-items: baseline; gap: 16px; }
.p-week .wk {
  font-size: 30px; font-weight: 700; color: var(--ink); background: var(--gold);
  padding: 0 14px; transform: skewX(-9deg); letter-spacing: 1px;
}
.p-week .opp { font-size: 46px; font-weight: 700; letter-spacing: 1px; }

  <div id="viewport">

          <div class="num-badge"><span id="hdr-num"></span></div>

            <div class="last" id="hdr-last"></div>
          </div>
        </div>
        <div class="title-block">
          <div class="title-main">WEEK 8 MATCHUP</div>
          <div class="title-sub">vs BUFFALO'S COVERAGE</div>
        </div>
      </header>

      <svg id="field" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

      <aside id="panel"></aside>

      <nav id="tabs"></nav>

      <footer id="footer"></footer>

      <div id="overlay"></div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-restart" title="Restart (R)">⏮</button>
    <button id="btn-play" title="Play / pause (Space)">❚❚</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <button id="btn-speed" title="Playback speed">1×</button>
  </div>

  <script>
/*
 * Shared engine for the telestrator-style field animations.
 *
 * Everything on screen is a pure function of time `t` (seconds): RT.run()
 * rebuilds the active segment when it changes and then only updates
 * attributes. That keeps playback, scrubbing and frame-by-frame video export
 * (tools/record.mjs) identical.
 *
 * Field coordinates: X = yards across (0 = middle, + = offense's right),
 * D = yards downfield from the line of scrimmage.
 */
window.RT = (() => {
  'use strict';

  const SVGNS = 'http://www.w3.org/2000/svg';
  const query = new URLSearchParams(location.search);
  const RECORD = query.has('record');
  const VERTICAL = query.get('format') === 'vertical';
  if (RECORD) document.body.classList.add('record');
  if (VERTICAL) document.body.classList.add('vertical');
  const STAGE = VERTICAL ? { w: 1080, h: 1920 } : { w: 1920, h: 1080 };

  // ---------- small helpers ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const easeOut = (u) => 1 - Math.pow(1 - u, 3);
  const easeBack = (u) => 1 + 2.70158 * Math.pow(u - 1, 3) + 1.70158 * Math.pow(u - 1, 2);
  const f1 = (n) => n.toFixed(1);

  function svg(tag, attrs, parent) {
    const n = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function text(parent, str, attrs) {
    const n = svg('text', attrs, parent);
    n.textContent = str;
    return n;
  }
  const $ = (id) => document.getElementById(id);

  // ---------- camera / projection (field yards -> stage pixels) ----------
  // X: yards across (0 = middle of the field, + = offense's right)
  // D: yards downfield from the line of scrimmage
  const HALF = 160 / 6;
  const D_MIN = -8;
  const LANE_X = 19.5;
  const BOX = VERTICAL ? { x: 30, y: 290, w: 1020, h: 860 } : { x: 36, y: 150, w: 1228, h: 822 };
  const CAM = { h: 56, back: 6, pitch: (43 * Math.PI) / 180 };
  const SP = Math.sin(CAM.pitch);
  const CP = Math.cos(CAM.pitch);

  function rawProject(X, D) {
    const z = D + CAM.back;
    const zc = CAM.h * SP + z * CP;
    const yc = -CAM.h * CP + z * SP;
    return [X / zc, -yc / zc, zc];
  }
  // Sidelines at the LOS span the box width; the far edge (D_MAX) is chosen so
  // that ~7 yards of backfield stay visible at the bottom of the box.
  const fitFor = (dMax) => {
    const s = BOX.w / ((2 * (VERTICAL ? 23.5 : 28.4)) / rawProject(0, 0)[2]);
    return { s, ox: BOX.x + BOX.w / 2, oy: BOX.y + 14 - s * rawProject(0, dMax)[1] };
  };
  let D_MAX = 32;
  for (let dm = 30, best = Infinity; dm <= 60; dm += 0.5) {
    const f = fitFor(dm);
    const err = Math.abs(f.oy + f.s * rawProject(0, -7)[1] - (BOX.y + BOX.h));
    if (err < best) { best = err; D_MAX = dm; }
  }
  const FIT = fitFor(D_MAX);
  function P(X, D) {
    const r = rawProject(X, D);
    return { x: FIT.ox + FIT.s * r[0], y: FIT.oy + FIT.s * r[1], k: FIT.s / r[2] };
  }
  const K0 = P(0, 0).k;
  const poly = (pts) => pts.map(([X, D]) => { const q = P(X, D); return `${f1(q.x)},${f1(q.y)}`; }).join(' ');
  const quad = (x0, d0, x1, d1) => poly([[x0, d0], [x1, d0], [x1, d1], [x0, d1]]);
  const foreshorten = (X, D) => (P(X, D - 0.5).y - P(X, D + 0.5).y) / P(X, D).k;

  // ---------- route shapes, in [outward yards, depth yards] relative to alignment ----------
  function curve(p0, c, p1, n = 14) {
    const out = [];
    for (let i = 1; i <= n; i++) {
      const u = i / n, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
      out.push([a * p0[0] + b * c[0] + d * p1[0], a * p0[1] + b * c[1] + d * p1[1]]);
    }
    return out;
  }
  const ROUTES = {
    GO: (d) => [[0, 0], [0, 5], ...curve([0, 5], [0.2, d * 0.65], [1.8, d])],
    FADE: (d) => [[0, 0], [0, 1.5], ...curve([0, 1.5], [0.4, d * 0.55], [3.0, d])],
    OUT: (d, t) => [[0, 0], [0, d - 0.4], [0.5, d], [t.oob ? 8.2 : 6.6, d - 0.3]],
    CURL: (d) => [[0, 0], [0, d + 1.4], ...curve([0, d + 1.4], [-0.2, d + 2.4], [-1.7, d])],
    HITCH: (d) => [[0, 0], [0, d + 1], [-0.6, d]],
    COMEBACK: (d) => [[0, 0], [0, d + 3], [2.4, d]],
    SLANT: (d) => [[0, 0], [0, 1.5], [-(d - 1.5) * 0.9, d]],
    DIG: (d) => [[0, 0], [0, d - 0.3], [-0.7, d], [-13, d]],
    POST: (d) => [[0, 0], [0, 11], [-(d - 11) * 0.65, d]],
    CORNER: (d) => [[0, 0], [0, 9], [(d - 9) * 0.6, d]],
    SEAM: (d) => [[0, 0], [0, 4], ...curve([0, 4], [-0.4, d * 0.6], [-1.2, d])],
    DRAG: (d) => [[0, 0], [-0.8, 1.2], ...curve([-0.8, 1.2], [-3, d], [-14, d])],
    FLAT: (d) => [[0, 0], [0, 1], ...curve([0, 1], [1.5, d], [6, d])],
  };

  // t: { route, side: 'L'|'R', depth, x? (alignment yards from the middle; default wide) }
  function makeRoute(t) {
    const out = t.side === 'L' ? -1 : 1;
    const x0 = out * (t.x != null ? t.x : LANE_X);
    const rel = (ROUTES[t.route] || ROUTES.GO)(t.depth, t);
    const pts = [];
    rel.forEach(([o, d], i) => {
      if (i > 0) {
        const [po, pd] = rel[i - 1];
        const steps = Math.max(1, Math.ceil(Math.hypot(o - po, d - pd) / 1.5));
        for (let s = 1; s < steps; s++) pts.push(P(x0 + out * lerp(po, o, s / steps), lerp(pd, d, s / steps)));
      }
      pts.push(P(x0 + out * o, d));
    });
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    const [eo, ed] = rel[rel.length - 1];
    const miss = t.miss || [0, 0];
    return {
      pts, cum, L: cum[cum.length - 1], out, x0,
      d: 'M' + pts.map((p) => `${f1(p.x)} ${f1(p.y)}`).join(' L'),
      end: pts[pts.length - 1],
      endField: [x0 + out * eo, ed],
      ballField: [x0 + out * (eo + miss[0]), ed + miss[1]],
    };
  }
  function pointAt(r, s) {
    s = clamp(s, 0, r.L);
    let i = 1;
    while (i < r.cum.length - 1 && r.cum[i] < s) i++;
    const a = r.pts[i - 1], b = r.pts[i];
    const segLen = r.cum[i] - r.cum[i - 1] || 1;
    const u = (s - r.cum[i - 1]) / segLen;
    return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), k: lerp(a.k, b.k, u), ang: Math.atan2(b.y - a.y, b.x - a.x) };
  }
  function dashArray(L, p, dashed) {
    const drawn = Math.max(0.001, L * p);
    if (!dashed) return `${f1(drawn)} ${f1(L + 20)}`;
    const arr = [];
    let s = 0;
    while (s + 16 < drawn) { arr.push(16, 11); s += 27; }
    arr.push(Math.max(0.001, Math.min(16, drawn - s)), L + 60);
    return arr.map(f1).join(' ');
  }

  // ---------- SVG scaffolding ----------
  const root = $('field');
  root.setAttribute('width', STAGE.w);
  root.setAttribute('height', STAGE.h);
  root.setAttribute('viewBox', `0 0 ${STAGE.w} ${STAGE.h}`);
  const defs = svg('defs', null, root);
  defs.innerHTML = `
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="58%" r="70%">
      <stop offset="55%" stop-color="#07061a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07061a" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07061a" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#07061a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lights" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laneFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a44e0"/><stop offset="1" stop-color="#241773"/>
    </linearGradient>
    <clipPath id="clipField"><rect x="${BOX.x}" y="${BOX.y}" width="${BOX.w}" height="${BOX.h}" rx="22"/></clipPath>`;
  const world = svg('g', { 'clip-path': 'url(#clipField)' }, root);
  svg('rect', { x: BOX.x, y: BOX.y, width: BOX.w, height: BOX.h, rx: 22, fill: 'none', stroke: 'rgba(255,199,44,0.35)', 'stroke-width': 2 }, root);
  const labels = svg('g', null, root);
  const screen = svg('g', null, root);

  // ---------- field drawing ----------
  const GREEN_A = '#2f8a3a';
  const GREEN_B = '#287a33';

  function drawField(parent, G, ez, turfOnly = false) {
    const g = svg('g', null, parent);
    const known = G != null;
    const off = known ? ((G % 5) + 5) % 5 : 0;
    const lo = D_MIN - 4, hi = D_MAX + 8;
    const start = Math.floor((lo - off) / 5) * 5 + off;
    svg('polygon', { points: quad(-44, lo, 44, hi), fill: '#1b5524' }, g);
    for (let a = start; a < hi; a += 5) {
      const n = known ? G - (a + 2.5) : 50;
      const band = ((Math.round((a - off) / 5) % 2) + 2) % 2;
      let fill = band ? GREEN_B : GREEN_A;
      if (n < -10 || n > 110) fill = '#173f1d';
      else if (n < 0 || n > 100) fill = ez;
      svg('polygon', { points: quad(-HALF, a, HALF, a + 5), fill }, g);
    }
    if (turfOnly) return g;
    // yard lines + goal / end lines
    for (let d = start; d <= hi; d += 5) {
      const n = known ? G - d : 50;
      const edge = n === 0 || n === 100 || n === -10 || n === 110;
      if (!edge && (n < 0 || n > 100)) continue;
      const w = n === 0 || n === 100 ? 0.34 : 0.15;
      svg('polygon', { points: quad(-HALF, d - w / 2, HALF, d + w / 2), fill: '#fff', opacity: edge ? 0.95 : 0.62 }, g);
    }
    // sidelines
    const dLo = known ? Math.max(lo, G - 110) : lo;
    const dHi = known ? Math.min(hi, G + 10) : hi;
    if (dHi > dLo) {
      svg('polygon', { points: quad(-HALF - 0.4, dLo, -HALF, dHi), fill: '#fff', opacity: 0.9 }, g);
      svg('polygon', { points: quad(HALF, dLo, HALF + 0.4, dHi), fill: '#fff', opacity: 0.9 }, g);
    }
    // hash marks and sideline ticks
    for (let d = Math.ceil(lo); d <= hi; d++) {
      const n = known ? G - d : 50 - d;
      if (((n % 5) + 5) % 5 === 0 || n <= 0 || n >= 100) continue;
      [-1, 1].forEach((sg) => {
        svg('polygon', { points: quad(sg * 3.08 - 0.33, d - 0.07, sg * 3.08 + 0.33, d + 0.07), fill: '#fff', opacity: 0.55 }, g);
        svg('polygon', { points: quad(sg * (HALF - 1.0), d - 0.07, sg * (HALF - 0.35), d + 0.07), fill: '#fff', opacity: 0.45 }, g);
      });
    }
    // yard numbers
    if (known) {
      for (let d = start; d <= hi; d += 5) {
        const n = G - d;
        if (n <= 0 || n >= 100 || n % 10 !== 0) continue;
        const label = String(n <= 50 ? n : 100 - n);
        [-1, 1].forEach((sg) => {
          const X = sg * (HALF - 12.5);
          const q = P(X, d);
          const fs = 2.6 * q.k;
          text(g, label, {
            transform: `translate(${f1(q.x)},${f1(q.y)}) scale(1,${foreshorten(X, d).toFixed(3)}) rotate(${sg < 0 ? 90 : -90})`,
            'font-size': f1(fs), 'font-weight': 600, fill: '#fff', opacity: 0.8,
            'text-anchor': 'middle', 'dominant-baseline': 'central', 'letter-spacing': f1(fs * 0.12),
          });
        });
      }
    }
    return g;
  }

  function drawFieldOverlays(parent) {
    svg('rect', { x: BOX.x, y: BOX.y, width: BOX.w, height: BOX.h, fill: 'url(#lights)' }, parent);
    svg('rect', { x: BOX.x, y: BOX.y, width: BOX.w, height: BOX.h, fill: 'url(#vignette)' }, parent);
    svg('rect', { x: BOX.x, y: BOX.y, width: BOX.w, height: BOX.h, fill: 'url(#horizon)' }, parent);
  }

  function drawDepthMarks(parent) {
    const g = svg('g', { opacity: 0.75 }, parent);
    for (let d = 5; d <= D_MAX - 2; d += 5) {
      const q = P(HALF + 0.9, d);
      text(g, `+${d}`, { x: f1(q.x), y: f1(q.y), 'font-size': f1(Math.max(13, q.k * 0.85)), 'font-weight': 500, fill: '#d8f5dc', 'dominant-baseline': 'central' });
    }
    return g;
  }

  // ---------- players ----------
  const OFFENSE = [[-4.4, -1], [-2.2, -1], [0, -1], [2.2, -1], [4.4, -1], [0, -5], [2, -5.3], [6.8, -1.2], [-12.5, -1]];
  const DEFENSE = [[-LANE_X, 2], [LANE_X, 2], [-9, 13], [9, 13], [-4.5, 5], [0.5, 5.5], [5, 5]];

  function drawFormation(parent, opts = {}) {
    const g = svg('g', null, parent);
    const los = svg('g', null, g);
    svg('polygon', { points: quad(-HALF, -0.16, HALF, 0.16), fill: '#2f9bff', filter: 'url(#glow)' }, los);
    if (!opts.noDefense) {
      DEFENSE.forEach(([X, D]) => {
        const q = P(X, D), s = 0.62 * q.k;
        svg('path', { d: `M${f1(q.x - s)} ${f1(q.y - s * 0.7)} L${f1(q.x + s)} ${f1(q.y + s * 0.7)} M${f1(q.x + s)} ${f1(q.y - s * 0.7)} L${f1(q.x - s)} ${f1(q.y + s * 0.7)}`, stroke: '#ff9aa8', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.4 }, g);
      });
    }
    OFFENSE.forEach(([X, D]) => {
      if (opts.skipX != null && Math.abs(X - opts.skipX) < 0.5) return; // a featured player lines up here
      const q = P(X, D);
      svg('ellipse', { cx: f1(q.x), cy: f1(q.y), rx: f1(0.78 * q.k), ry: f1(0.78 * q.k * 0.8), fill: 'rgba(255,255,255,0.16)', stroke: 'rgba(255,255,255,0.7)', 'stroke-width': 2 }, g);
    });
    const wide = {};
    ['L', 'R'].forEach((side) => {
      const q = P((side === 'L' ? -1 : 1) * LANE_X, -0.8);
      wide[side] = svg('ellipse', { cx: f1(q.x), cy: f1(q.y), rx: f1(0.78 * q.k), ry: f1(0.78 * q.k * 0.8), fill: 'rgba(255,255,255,0.16)', stroke: 'rgba(255,255,255,0.7)', 'stroke-width': 2 }, g);
    });
    const ball = P(0, 0);
    svg('ellipse', { cx: f1(ball.x), cy: f1(ball.y), rx: 7, ry: 4.5, fill: '#8a4a1c', stroke: '#2b1406', 'stroke-width': 1.5 }, g);
    return { g, wide };
  }

  function makeLaneIcon(parent, label) {
    const g = svg('g', null, parent);
    svg('circle', { r: 30, fill: '#ffc72c', opacity: 0.35, filter: 'url(#bigglow)' }, g);
    svg('ellipse', { rx: 22, ry: 19, cy: 3, fill: '#000', opacity: 0.35 }, g);

    return g;
  }
  function placeLane(icon, x, y, k, scale = 1, opacity = 1) {
    icon.setAttribute('transform', `translate(${f1(x)},${f1(y)}) scale(${(scale * k / K0).toFixed(3)})`);

  function makeBall(parent) {
    const g = svg('g', { opacity: 0 }, parent);
    const shadow = svg('ellipse', { rx: 8, ry: 3.5, fill: '#000', opacity: 0.4 }, g);
    const body = svg('g', null, g);
    svg('ellipse', { rx: 11, ry: 6.5, fill: '#8a4a1c', stroke: '#2b1406', 'stroke-width': 1.5 }, body);
    svg('path', { d: 'M-4 0 L4 0 M-2 -2 L-2 2 M0 -2 L0 2 M2 -2 L2 2', stroke: '#fff', 'stroke-width': 1.3 }, body);
    return { g, shadow, body };
  }

  // ---------- telestrator fx ----------
  function scribblePath(cx, cy, rx, ry, seed) {
    const pts = [];
    const N = 80;
    const a0 = -2.4 + seed * 0.9;
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const a = a0 + u * 1.3 * 2 * Math.PI;
      const j = 1 + 0.07 * Math.sin(u * 19 + seed * 3) + 0.14 * u;
      const x = Math.cos(a) * rx * j, y = Math.sin(a) * ry * j;
      pts.push([cx + x + 0.18 * y, cy + y]);
    }
    let L = 0;
    for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    return { d: 'M' + pts.map((p) => `${f1(p[0])} ${f1(p[1])}`).join(' L'), L };
  }
  function burstPoints(R, r, n, seed) {
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
      const rad = i % 2 ? r : R * (0.85 + 0.15 * Math.sin(i * 2.3 + seed));
      pts.push(`${f1(Math.cos(a) * rad)},${f1(Math.sin(a) * rad)}`);
    }
    return pts.join(' ');
  }
  const INK = '#07061a';
  function outlined(attrs, w = 7) {
    return Object.assign({ stroke: INK, 'stroke-width': w, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, attrs);
  }

  function makeChip(parent, str, color) {
    const g = svg('g', { opacity: 0 }, parent);
    const w = str.length * 10.5 + 18;
    svg('rect', { x: -w / 2, y: -15, width: w, height: 30, rx: 4, fill: 'rgba(7,6,26,0.86)', stroke: color, 'stroke-width': 2 }, g);
    text(g, str, { y: 1, 'font-size': 19, 'font-weight': 600, fill: '#fff', 'text-anchor': 'middle', 'dominant-baseline': 'central', 'letter-spacing': 0.5 });
    return g;
  }

  function setRoute(tgt, p, opacity) {
    tgt.g.setAttribute('opacity', opacity.toFixed(3));
    const da = dashArray(tgt.r.L, p, tgt.dashed);
    tgt.line.setAttribute('stroke-dasharray', da);
    tgt.under.setAttribute('stroke-dasharray', dashArray(tgt.r.L, p, false));
    const tip = pointAt(tgt.r, tgt.r.L * p);
    tgt.arrow.setAttribute('transform', `translate(${f1(tip.x)},${f1(tip.y)}) rotate(${f1((tip.ang * 180) / Math.PI)}) scale(${(tip.k / K0).toFixed(3)})`);
    const showBall = tgt.ballAtEnd && p >= 1;
    tgt.arrow.setAttribute('opacity', p > 0.01 && !showBall ? 1 : 0);
    tgt.endBall.setAttribute('opacity', showBall ? 1 : 0);
    return tip;
  }

  // Glowing route line with an arrow tip (and optional ball marker at the end).
  function routeLine(parent, r, { color, dashed = false, ballAtEnd = false, width = 6 }) {
    const g = svg('g', { opacity: 0 }, parent);
    const under = svg('path', { d: r.d, fill: 'none', stroke: INK, 'stroke-width': width + 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.45 }, g);
    const line = svg('path', { d: r.d, fill: 'none', stroke: color, 'stroke-width': width, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', filter: 'url(#glow)' }, g);
    const arrow = svg('path', { d: 'M8 0 L-8 -8 L-4 0 L-8 8 Z', fill: color, stroke: INK, 'stroke-width': 1.5 }, g);
    const endBall = svg('g', { opacity: 0 }, g);
    svg('ellipse', { rx: 9, ry: 5.5, fill: '#8a4a1c', stroke: INK, 'stroke-width': 1.5, transform: 'rotate(-25)' }, endBall);
    endBall.setAttribute('transform', `translate(${f1(r.end.x)},${f1(r.end.y)})`);
    return { r, g, under, line, arrow, endBall, dashed, color, ballAtEnd };
  }

  function placeBall(ball, from, to, u) {
    if (u <= 0 || u >= 1) { ball.g.setAttribute('opacity', 0); return; }
    const X = lerp(from[0], to[0], u), Dd = lerp(from[1], to[1], u);
    const ground = P(X, Dd);
    const dist = Math.hypot(to[0] - from[0], to[1] - from[1]);
    const h = Math.sin(Math.PI * u) * (2.5 + dist * 0.28) * ground.k;
    ball.g.setAttribute('opacity', 1);
    ball.shadow.setAttribute('transform', `translate(${f1(ground.x)},${f1(ground.y)}) scale(${(ground.k / K0).toFixed(3)})`);
    const a = P(from[0], from[1]), b = P(to[0], to[1]);
    const ang = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
    ball.body.setAttribute('transform', `translate(${f1(ground.x)},${f1(ground.y - h)}) rotate(${f1(ang)}) scale(${(ground.k / K0).toFixed(3)})`);
  }

  // ---------- per-segment layers ----------
  const panel = $('panel');
  const overlay = $('overlay');

  function clearAll() {
    world.innerHTML = '';
    labels.innerHTML = '';
    screen.innerHTML = '';
    overlay.innerHTML = '';

  function playBug() {

  // Full-width swoosh banner used at the start of a segment.
  function banner(big, title, sub, color = '#241773') {
    const grp = svg('g', { opacity: 0 }, screen);
    const cy = BOX.y + BOX.h * 0.46;
    const x0 = BOX.x - 96, x1 = BOX.x + BOX.w + 76;

    svg('polygon', { points: `${x0 + 40},${cy - 70} ${x1 + 40},${cy - 70} ${x1},${cy + 70} ${x0},${cy + 70}`, fill: color, opacity: 0.94 }, grp);

        'inconsistent (The Athletic). That is exactly where curls and digs live.',
    },
    {
      id: 'c4',
      name: 'COVER 4',
      pct: 26.0,
      tagline: 'QUARTERS · FOUR DEEP · THREE UNDER',
      defenders: [
        { pos: 'CB', pre: [-19.5, 6.5], post: [-19.5, 16] },
        { pos: 'S', pre: [-9, 13], post: [-8, 16.5] },
        { pos: 'S', pre: [9, 13], post: [8, 16.5] },
        { pos: 'CB', pre: [19.5, 6.5], post: [19.5, 16] },
        { pos: 'OLB', pre: [-7, 0.7], post: [-12, 7] },
        { pos: 'LB', pre: [-2.6, 4.5], post: [-0.5, 8.5] },
        { pos: 'LB', pre: [2.6, 4.5], post: [11, 7] },
        { pos: 'DL', pre: [-3.2, 0.7], post: [-2.6, -3.6], rush: true },
        { pos: 'DL', pre: [0, 0.7], post: [0.3, -3.1], rush: true },
        { pos: 'DL', pre: [3.2, 0.7], post: [2.6, -3.6], rush: true },
        { pos: 'OLB', pre: [7.2, 0.7], post: [4.2, -4.6], rush: true },
      ],
      zones: [
        { type: 'deep', c: [-20, 20.5], r: [6.3, 7.5], label: 'DEEP ¼' },
        { type: 'deep', c: [-6.7, 21], r: [6.3, 7.5], label: 'DEEP ¼' },
        { type: 'deep', c: [6.7, 21], r: [6.3, 7.5], label: 'DEEP ¼' },
        { type: 'deep', c: [20, 20.5], r: [6.3, 7.5], label: 'DEEP ¼' },
        { type: 'hook', c: [-12, 7.5], r: [5.5, 4], label: 'HOOK-CURL' },
        { type: 'hook', c: [0, 8.5], r: [5, 4], label: 'MIDDLE HOOK' },
        { type: 'hook', c: [12, 7.5], r: [5.5, 4], label: 'HOOK-CURL' },
      ],
      holes: [
        { at: [-22.5, 4.5], label: 'SOFT FLAT' },
        { at: [-20.5, 11], label: 'UNDER THE CB' },
      ],
      grades: {
        HITCH: ['win', 'Only 3 underneath; the CB bails to his deep quarter'],
        CURL: ['win', 'Outside the hook-curl defender, under the CB'],
        COMEBACK: ['win', 'CB carries the stem deep, so the comeback opens late'],
        OUT: ['win', 'Flat is soft with just 3 underneath defenders'],
        SLANT: ['mid', 'Runs into the hook defender; the safety drives on it'],
        DIG: ['mid', 'Quarters safeties drive hard on in-breakers'],
        GO: ['tough', 'CB stays on top with the safety over the top'],
        POST: ['tough', 'The inside safety sits right on the post'],
        FADE: ['tough', 'CB on top plus safety help: contested at best'],
        CORNER: ['tough', 'Bracketed: CB and safety both in the area'],
      },
      note:
        "Quarters is the Bills' best look on film: on one Patriots deep shot both outside " +
        'WRs ran into double coverage and the middle safety drove on in-breakers.',
    },
  ],

  verdict: {
    points: [
      { good: true, text: 'Zone-heavy: Cover 3 or 4 on 60%+ of snaps means fewer press-man reps, the main knock on his release at USC.' },
      { good: true, text: 'CATCH_DEPTH' }, // filled in from Lane's targets
      { good: false, text: 'DEEP_SHOTS' }, // filled in from Lane's targets
      { good: true, text: 'Buffalo allows 285.8 pass yds/g (31st), ranks top-4 in fantasy points allowed to WRs, and Lamar Jackson returns.' },
    ],
    caveat:
      'Small sample (13 targets). Coverage rates come from one charting analysis; grades apply ' +
      'standard coverage rules to reconstructed route types.',
  },

  sources: [
    'Buffalo Rumblings coverage charting',
    'The Lead film review',
    'The Athletic',
    'AP',
    'ESPN',
    'Sharp Football',
    'StatChasers',
  ],
};
</script>
  <script>
/*
 * Week 8 matchup: the Bills' two main zone shells (Cover 3, Cover 4) modeled
 * on the field, with Ja'Kobi Lane's route tree graded against each.
 * Rendering primitives and playback live in engine.js.
 */
(() => {
  'use strict';

  const LANE = window.LANE_DATA;
  const BILLS = window.BILLS_DATA;
  const {
    clamp, lerp, span, easeInOut, easeOut, easeBack, f1, svg, text, BOX, P, LANE_X, makeRoute,
    pointAt, overlay, panel, labels, drawField, drawFormation, makeLaneIcon, placeLane, makeChip,
    routeLine, setRoute, layerSet, fieldTitle, banner, slideBanner, $,
  } = RT;

  const BUF_BLUE = '#00338D';
  const BUF_RED = '#C60C30';
  const BUF_COLORS = [BUF_BLUE, BUF_RED];
  const { GRADE, blendGrade, meterLabel, buildZones, setZones, placeAt, buildDefense, setDefense, holeMark, setHole } = MK;
  const LOS_G = 60; // model every snap from Baltimore's own 40

  // ---------- Lane's route tree, grouped by route type ----------
  const TARGETS = LANE.games.filter((g) => !g.ir).flatMap((g) => g.targets.filter((t) => t.result !== 'noplay'));
  const TOTAL = TARGETS.length;
  const ROUTE_ORDER = ['HITCH', 'SLANT', 'CURL', 'COMEBACK', 'OUT', 'DIG', 'POST', 'CORNER', 'GO', 'FADE'];
  const DEEP_ROUTES = ['GO', 'FADE', 'POST', 'CORNER'];
  const TREE = ROUTE_ORDER.map((route) => {
    const ts = TARGETS.filter((t) => t.route === route);
    if (!ts.length) return null;
    const catches = ts.filter((t) => t.result === 'catch');
    return {
      route, n: ts.length, rec: catches.length,
      yds: catches.reduce((a, t) => a + t.yards, 0),
      depth: ts.reduce((a, t) => a + t.depth, 0) / ts.length,
    };
  }).filter(Boolean);

  // ---------- grading ----------
  const COVS = BILLS.coverages;
  const SHARE = COVS.reduce((a, c) => a + c.pct, 0);
  const gradeOf = (cov, route) => (cov.grades[route] || ['mid', ''])[0];
  const blendedScore = (route) => COVS.reduce((a, c) => a + GRADE[gradeOf(c, route)].score * c.pct, 0) / SHARE;
  function tally(cov) {
    const out = { win: 0, mid: 0, tough: 0 };
    TREE.forEach((r) => { out[gradeOf(cov, r.route)] += r.n; });
    return out;
  }
  const MATCHUP = TREE.reduce((a, r) => a + blendedScore(r.route) * r.n, 0) / TOTAL; // -1 … +1

  function verdictPoints() {
    const catches = TARGETS.filter((t) => t.result === 'catch');
    const yds = catches.map((t) => t.yards);
    const deep = TARGETS.filter((t) => DEEP_ROUTES.includes(t.route));
    const deepRec = deep.filter((t) => t.result === 'catch').length;
    const deepNames = [...new Set(deep.map((t) => t.route))].join(', ');
    return BILLS.verdict.points.map((p) => {
      if (p.text === 'CATCH_DEPTH') {
        return { good: true, text: `All ${catches.length} of his NFL catches have gained ${Math.min(...yds)}–${Math.max(...yds)} yards: the cushion Cover 3 and Cover 4 corners give up when they bail.` };
      }
      if (p.text === 'DEEP_SHOTS') {
        return { good: false, text: `Deep shots (${deepNames}) attack the strength of both shells: he is ${deepRec}-for-${deep.length} on them so far.` };
      }
      return p;
    });
  }

  // Lane's tree from the boundary (offense's left), one route per type.
  function buildTree(layer, colorOf) {
    return TREE.map((r) => {
      const route = makeRoute({ route: r.route, side: 'L', depth: Math.round(r.depth * 2) / 2 });
      const grade = colorOf(r.route);
      const line = routeLine(layer, route, { color: GRADE[grade].color, dashed: grade === 'tough' });
      const chip = makeChip(labels, `${r.route} ×${r.n} · ${GRADE[grade].label}`, GRADE[grade].color);
      const lead = pointAt(route, route.L);
      const cx = route.end.x + Math.cos(lead.ang) * 30;
      const cy = route.end.y - 42;
      chip.setAttribute('transform', `translate(${f1(clamp(cx, BOX.x + 120, BOX.x + BOX.w - 120))},${f1(Math.max(BOX.y + 24, cy))})`);
      return Object.assign(line, { tree: r, grade, chip });
    });
  }

  function baseField(L, opts = {}) {
    drawField(L.fields, LOS_G, BUF_BLUE);
    const form = drawFormation(L.formation, { noDefense: true });
    form.wide.L.setAttribute('opacity', 0); // Lane's spot
    const zoneLayer = svg('g', null, L.formation);
    const trailLayer = svg('g', null, L.formation);
    const lane = makeLaneIcon(L.actors, LANE.player.number);
    const align = P(-LANE_X, 0);
    placeLane(lane, align.x, align.y, align.k, 1, opts.lane === false ? 0 : 1);
    return { form, zoneLayer, trailLayer, lane, align };
  }

  // ---------- panels ----------
  const statBox = (k, v, cls = '') => `<div class="stat ${cls}"><div class="v">${v}</div><div class="k">${k}</div></div>`;

  function buildDefensePanel() {
    const d = BILLS.defense;
    panel.innerHTML = `
      <div class="p-week"><span class="wk wk-buf">2026</span><span class="opp">BUFFALO DEFENSE</span></div>
      <div class="p-meta"><span>DC ${d.dc}</span><span>·</span><span>${d.dcNote}</span></div>
      <div class="mix">${d.mix.map((m) => `
        <div class="mix-row"><div class="lbl">${m.label}</div>
          <div class="track"><div class="fill ${m.id}" data-w="${m.pct}"></div></div>
          <div class="pct">${m.pct.toFixed(1)}%</div>
          <div class="sub">${m.note}</div></div>`).join('')}
      </div>
      <div class="p-stats four">${d.stats.map((s) => statBox(`${s.k}<br><span class="rk">${s.r}</span>`, s.v)).join('')}</div>
      <div class="blitz">BLITZ RATE <b>${d.blitz.pct}%</b> · ${d.blitz.rank} IN THE NFL</div>
      <div class="p-note"><b>FILM NOTE</b>${d.note}</div>`;
    return { fills: [...panel.querySelectorAll('.mix .fill')] };
  }

  function buildCoveragePanel(cov) {
    const t = tally(cov);
    panel.innerHTML = `
      <div class="p-week"><span class="wk wk-buf">${cov.pct.toFixed(1)}%</span><span class="opp">${cov.name}</span></div>
      <div class="p-meta"><span>${cov.tagline}</span></div>
      <div class="p-stats three">${['win', 'mid', 'tough'].map((g) => statBox(`${GRADE[g].label}`, 0, `g-${g}`)).join('')}</div>
      <div class="p-list compact">${TREE.map((r) => {
        const [g, why] = cov.grades[r.route] || ['mid', ''];
        return `<div class="row"><div class="n">×${r.n}</div>
          <div class="rt">${r.route}<span class="los">${r.rec ? `${r.rec} REC · ${r.yds} YDS` : `0 REC`}</span></div>
          <div class="badge g-${g}">${GRADE[g].label}</div>
          <div class="pbp">${why}</div></div>`;
      }).join('')}</div>
      <div class="p-note small"><b>BILLS FILM</b>${cov.note}</div>`;
    return { rows: [...panel.querySelectorAll('.row')], stats: [...panel.querySelectorAll('.stat .v')], total: t };
  }

  function buildVerdictPanel() {
    const label = meterLabel(MATCHUP);
    const winPct = (cov) => Math.round((100 * tally(cov).win) / TOTAL);
    const deep = TARGETS.filter((t) => DEEP_ROUTES.includes(t.route));
    panel.innerHTML = `
      <div class="p-week"><span class="wk">WEEK ${BILLS.matchup.week}</span><span class="opp">THE VERDICT</span></div>
      <div class="p-meta"><span>LANE vs THE BILLS' ZONE MIX</span><span>·</span><span>${TOTAL} TARGETS GRADED</span></div>
      <div class="meter"><div class="meter-bar"><div class="meter-mark"></div></div>
        <div class="meter-ends"><span>TOUGH</span><span>NEUTRAL</span><span>FAVORABLE</span></div>
        <div class="meter-label">${label}</div></div>
      <div class="s-line three">${[
        [`${winPct(COVS[0])}%`, `WIN ROUTES vs ${COVS[0].name}`],
        [`${winPct(COVS[1])}%`, `WIN ROUTES vs ${COVS[1].name}`],
        [`${deep.filter((t) => t.result === 'catch').length}/${deep.length}`, 'DEEP SHOTS CAUGHT'],
      ].map(([v, k]) => statBox(k, v, 'small')).join('')}</div>
      <ul class="bullets">${verdictPoints().map((p) => `<li class="${p.good ? 'good' : 'bad'}"><span class="ic">${p.good ? '✔' : '✖'}</span><span>${p.text}</span></li>`).join('')}</ul>
      <div class="p-note"><b>CAVEAT</b>${BILLS.verdict.caveat}</div>`;
    return {
      mark: panel.querySelector('.meter-mark'),
      label: panel.querySelector('.meter-label'),
      bullets: [...panel.querySelectorAll('.bullets li')],
    };
  }

  // ---------- header / footer ----------
  $('hdr-num').textContent = LANE.player.number;
  $('hdr-first').textContent = `${LANE.player.first} · ${LANE.player.pos} · ${LANE.player.team}`;
  $('hdr-last').textContent = LANE.player.last;
  $('footer').innerHTML =
    `<span>Coverage mix: Buffalo Rumblings charting, 2026 through Week 7. Grades apply standard coverage rules to Lane's charted routes (route types are reconstructions).</span>` +
    `<span>Sources: ${BILLS.sources.join(', ')} · Unofficial fan graphic</span>`;

  // ---------- segments ----------
  const T = { intro: 3.8, defense: 9.5, snap: 2.6, move: 1.1, holesAt: 4.0, holeGap: 0.45, routesAt: 5.6, route: 1.55, hold: 3.6, verdict: 12 };

  function buildIntro(seg) {
    const L = layerSet();
    const f = baseField(L);
    const cov = COVS[0];
    seg.ui = { zones: buildZones(f.zoneLayer, cov), defs: buildDefense(f.trailLayer, L.actors, cov, BUF_COLORS) };
    overlay.innerHTML = `<div class="ov-card ov-intro ov-matchup">
        <div class="l1">${LANE.player.first} ${LANE.player.last} vs</div>
        <div class="l2">BILLS D</div>
        <div class="l3">WEEK ${BILLS.matchup.week} COVERAGE MODEL</div>
        <div class="l4">RAVENS @ BILLS · ${BILLS.matchup.date}</div>
      </div>`;
    seg.ui.card = overlay.firstElementChild;
    seg.ui.lines = [...seg.ui.card.children];
  }
  function updateIntro(seg, lt) {
    const ui = seg.ui;
    setDefense(ui.defs, easeInOut(span(lt, 0.8, 1.9)), 0.55);
    setZones(ui.zones, span(lt, 1.2, 2.4) * 0.6);
    const [l1, l2, l3, l4] = ui.lines;
    const out = easeInOut(span(lt, seg.dur - 0.6, seg.dur));
    ui.card.style.transform = `translate(-50%,-50%) scale(${f1(1 + out * 0.15)})`;
    ui.card.style.opacity = 1 - out;
    const a = easeOut(span(lt, 0.05, 0.55));
    l1.style.opacity = a;
    l1.style.transform = `translateX(${f1((1 - a) * -300)}px)`;
    const b = span(lt, 0.25, 0.7);
    l2.style.opacity = clamp(b * 3);
    l2.style.transform = `scale(${lerp(2.4, 1, easeBack(b)).toFixed(3)}) skewX(-6deg)`;
    l3.style.clipPath = `inset(0 ${f1((1 - easeOut(span(lt, 0.85, 1.25))) * 100)}% 0 0)`;
    l4.style.opacity = easeOut(span(lt, 1.2, 1.7));
    $('header').style.opacity = 0;
    $('tabs').style.opacity = easeOut(span(lt, seg.dur - 0.5, seg.dur));
  }

  function buildDefenseSeg(seg) {
    const L = layerSet();
    const f = baseField(L);
    const defs = buildDefense(f.trailLayer, L.actors, COVS[0], BUF_COLORS);
    seg.ui = {
      defs,
      shell: holeMark(L.fx, [0, 13], 'TWO-HIGH LOOK PRE-SNAP', 3, [235, 46]),
      rotate: makeChip(labels, 'ROTATES TO COVER 3 OR COVER 4 AT THE SNAP', '#ffc72c'),
      panel: buildDefensePanel(),
      banner: banner('BILLS D', 'WHAT THEY PLAY', `DC ${BILLS.defense.dc} · 3-4 BASE · ${BILLS.matchup.records}`, BUF_BLUE),
    };
    const q = P(0, 13);
    seg.ui.rotate.setAttribute('transform', `translate(${f1(q.x)},${f1(q.y + 48)})`);
  }
  function updateDefenseSeg(seg, lt) {
    const ui = seg.ui;
    slideBanner(ui.banner, lt);
    ui.defs.forEach((o, i) => placeAt(o.icon, o.d.pre[0], o.d.pre[1], easeOut(span(lt, 1.5 + i * 0.06, 1.8 + i * 0.06))));
    setHole(ui.shell, easeOut(span(lt, 2.8, 3.5)));
    ui.rotate.setAttribute('opacity', easeOut(span(lt, 3.8, 4.2)));
    ui.panel.fills.forEach((f, i) => { f.style.width = `${f1(f.dataset.w * easeOut(span(lt, 0.6 + i * 0.25, 1.4 + i * 0.25)))}%`; });
  }

  function buildCoverage(seg) {
    const cov = seg.cov;
    const L = layerSet();
    const f = baseField(L);
    seg.ui = {
      f,
      zones: buildZones(f.zoneLayer, cov),
      defs: buildDefense(f.trailLayer, L.actors, cov, BUF_COLORS),
      holes: cov.holes.map((h, i) => holeMark(L.fx, h.at, h.label, i + 2)),
      routes: buildTree(L.routes, (route) => gradeOf(cov, route)),
      panel: buildCoveragePanel(cov),
      banner: banner(cov.name, cov.tagline, `${cov.pct.toFixed(1)}% OF BILLS SNAPS IN 2026`, BUF_BLUE),
      title: fieldTitle(`${cov.name} vs LANE'S TREE`, (() => { const t = tally(cov); return `${t.win} WIN · ${t.mid} CONTESTED · ${t.tough} TOUGH  (OF ${TOTAL} TARGETS)`; })()),
    };
    // Lane runs on top of the defenders
    L.actors.appendChild(f.lane);
  }
  function updateCoverage(seg, lt) {
    const ui = seg.ui;
    const n = ui.routes.length;
    slideBanner(ui.banner, lt);
    const preIn = easeOut(span(lt, 1.2, 1.6));
    const move = easeInOut(span(lt, T.snap, T.snap + T.move));
    setDefense(ui.defs, move, preIn);
    setZones(ui.zones, span(lt, T.snap + 0.3, T.snap + T.move + 0.4));
    const routesDone = lt >= T.routesAt + n * T.route;
    ui.holes.forEach((h, i) => setHole(h, easeOut(span(lt, T.holesAt + i * T.holeGap, T.holesAt + i * T.holeGap + 0.5)), lt < T.routesAt ? 1 : 0.55));

    const slot = Math.floor((lt - T.routesAt) / T.route);
    const counts = { win: 0, mid: 0, tough: 0 };
    ui.routes.forEach((rt, i) => {
      const s = lt - (T.routesAt + i * T.route);
      const p = easeInOut(span(s, 0.1, 0.85));
      setRoute(rt, p, i === slot && !routesDone ? 1 : s > 0 ? (routesDone ? 1 : 0.5) : 0);
      rt.chip.setAttribute('opacity', i === slot && !routesDone ? (easeOut(span(s, 0.7, 0.95)) * (1 - span(s, 1.35, 1.55))).toFixed(3) : 0);
      if (s >= 0.85) counts[rt.grade] += rt.tree.n;
    });
    // Lane runs the active route, then resets to his alignment
    const a = ui.f.align;
    if (slot >= 0 && !routesDone) {
      const rt = ui.routes[slot];
      const s = lt - (T.routesAt + slot * T.route);
      const tip = pointAt(rt.r, rt.r.L * easeInOut(span(s, 0.1, 0.85)));
      placeLane(ui.f.lane, tip.x, tip.y, tip.k, 0.7 + 0.3 * easeBack(span(s, 0, 0.15)), 1);
    } else {
      placeLane(ui.f.lane, a.x, a.y, a.k, routesDone ? 1 + 0.06 * Math.sin(lt * 6) : 1, 1);
    }
    ui.title.setAttribute('opacity', routesDone ? easeOut(span(lt, T.routesAt + n * T.route, T.routesAt + n * T.route + 0.4)) : 0);
    // panel
    ui.panel.rows.forEach((row, i) => {
      const u = easeOut(span(lt, 0.5 + i * 0.07, 0.9 + i * 0.07));
      row.style.opacity = u;
      row.style.transform = `translateX(${f1((1 - u) * 40)}px)`;
      row.classList.toggle('active', i === slot && !routesDone);
    });
    ['win', 'mid', 'tough'].forEach((g, i) => {
      const v = ui.panel.stats[i];
      if (v.textContent !== String(counts[g])) v.textContent = counts[g];
    });
  }

  function buildVerdict(seg) {
    const L = layerSet();
    const f = baseField(L);
    const holes = [];
    COVS.forEach((cov) => cov.holes.forEach((h) => holes.push(holeMark(L.fx, h.at, h.label, holes.length + 2))));
    seg.ui = {
      f, holes,
      routes: buildTree(L.routes, (route) => blendGrade(blendedScore(route))),
      panel: buildVerdictPanel(),
      title: fieldTitle('WHERE LANE CAN WIN', `ROUTES GRADED vs THE BILLS' COVER 3 / COVER 4 MIX`),
    };
  }
  function updateVerdict(seg, lt) {
    const ui = seg.ui;
    ui.title.setAttribute('opacity', easeOut(span(lt, 0.2, 0.6)));
    ui.routes.forEach((rt, i) => {
      setRoute(rt, easeInOut(span(lt, 0.5 + i * 0.2, 1.3 + i * 0.2)), 1);
      rt.chip.setAttribute('opacity', 0);
    });
    ui.holes.forEach((h, i) => setHole(h, easeOut(span(lt, 2.4 + i * 0.25, 2.9 + i * 0.25)), 0.85));
    const a = ui.f.align;
    placeLane(ui.f.lane, a.x, a.y, a.k, 1 + 0.06 * Math.sin(lt * 6), 1);
    const m = easeInOut(span(lt, 1.0, 2.6));
    ui.panel.mark.style.left = `${f1(50 + 50 * MATCHUP * m)}%`;
    const lu = easeBack(span(lt, 2.6, 3.0));
    ui.panel.label.style.opacity = clamp(lu);
    ui.panel.label.style.transform = `scale(${(0.6 + 0.4 * lu).toFixed(3)})`;
    ui.panel.bullets.forEach((b, i) => {
      const u = easeOut(span(lt, 3.2 + i * 0.5, 3.6 + i * 0.5));
      b.style.opacity = u;
      b.style.transform = `translateX(${f1((1 - u) * 40)}px)`;
    });
  }

  const covSegs = COVS.map((cov) => ({
    kind: 'coverage', cov, tab: cov.id, dur: T.routesAt + TREE.length * T.route + T.hold, build: buildCoverage, update: updateCoverage,
  }));
  RT.run({
    segments: [
      { kind: 'intro', tab: null, dur: T.intro, intro: true, build: buildIntro, update: updateIntro },
      { kind: 'defense', tab: 'defense', dur: T.defense, build: buildDefenseSeg, update: updateDefenseSeg },
      ...covSegs,
      { kind: 'verdict', tab: 'verdict', dur: T.verdict, build: buildVerdict, update: updateVerdict },
    ],
    tabs: [
      { id: 'defense', label: 'BILLS D' },
      ...COVS.map((c) => ({ id: c.id, label: `${c.name} · ${Math.round(c.pct)}%` })),
      { id: 'verdict', label: 'VERDICT' },
    ],
  });
})();
</script>
